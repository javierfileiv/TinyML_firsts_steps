# Sensor stack: MPU6050 over I2C1, data-ready interrupt on PA1
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_ACCEL_FS=4
CONFIG_MPU6050_GYRO_FS=1000
CONFIG_MPU6050_TRIGGER_GLOBAL_THREAD=y

# GPIO for KEY button (PA0) and user LED (PC13)
CONFIG_GPIO=y

# FPU for float signal processing
CONFIG_FPU=y

# C runtime
CONFIG_NEWLIB_LIBC=y

# CONFIG_CPP is required by TFLM in phase 3 but kept disabled for now:
# the system cross toolchain has no arm-none-eabi-g++ yet
# (Fedora package arm-none-eabi-gcc-cs-c++, or Zephyr SDK)
#CONFIG_CPP=y

# Console over USB CDC ACM for CSV telemetry (/dev/ttyACM0)
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
# start the USB device stack before main, so the host can enumerate CDC
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# 10 kHz tick for fine timing granularity (cooldown, debounce)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

CONFIG_MAIN_STACK_SIZE=4096
